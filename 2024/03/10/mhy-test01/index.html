<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><meta name="theme-color" content="#F7F4ED"/><meta name="author" content="Peng Zihao"/><title>mhy-test01 — PENG ZIHAO / XIAOBA</title><meta name="description" content="彭子豪的个人简历与技术文章归档"/><link rel="canonical" href="https://xiaobazeo.com/2024/03/10/mhy-test01/"/><link rel="alternate" type="application/atom+xml" title="PENG ZIHAO / XIAOBA Atom Feed" href="https://xiaobazeo.com/atom.xml"/><link rel="icon" href="/img/favicon.png"/><link rel="stylesheet" href="/css/main.css"/><meta name="generator" content="Hexo 5.4.2"></head><body class="post-page"><a class="skip-link" href="#main-content">跳到正文</a><header class="site-header"><div class="site-header__inner"><a class="site-brand" href="/">PENG ZIHAO / XIAOBA</a><nav class="primary-nav primary-nav--article" aria-label="文章导航"><ul class="primary-nav__list"><li><a href="/">简历</a></li><li><a href="/archives/">文章</a></li><li><a href="/tags/">标签</a></li></ul></nav></div></header><main class="article-shell" id="main-content"><div class="article-layout"><article class="post"><header class="post-header"><p class="post-kicker">Technical Writing / 技术文章</p><h1>mhy-test01</h1><p class="post-meta"><time datetime="2024-03-10T14:20:16.000Z">2024-03-10</time></p></header><div class="post-content"><h3 id="题目描述"><a href="#题目描述" class="headerlink" title="题目描述"></a>题目描述</h3><blockquote>
<figure class="highlight excel"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br></pre></td><td class="code"><pre><span class="line">地图上有<span class="built_in">n</span>个格子排成一排，最左边的格子为<span class="number">1</span>，最右边的格子为<span class="built_in">n</span>。</span><br><span class="line">第<span class="number">0</span>秒时，每个格子都有一只史莱姆。</span><br><span class="line"></span><br><span class="line">第i只史莱姆的跳跃方向用数组a表示。a[i]=<span class="number">0</span>表示史莱姆跳跃的方向是往左。若第 i 秒史莱姆位于格子 x，那么第 i+<span class="number">1</span> 秒史莱姆会跳到格子 x-<span class="number">1</span> 。如果当前史莱姆在格子 ，则下一秒史莱姆将跳出地图。a[i]=<span class="number">1</span>表示史莱姆跳跃的方向是往右。若第 i 秒史莱姆位于格子 x，那么第 i+<span class="number">1</span> 秒史莱姆会跳到格子 x+<span class="number">1</span> 。如果当前史莱姆在格子<span class="built_in">n</span>，则下一秒史莱姆将跳出地图。</span><br><span class="line"></span><br><span class="line">米小游想知道第<span class="number">1</span>~<span class="built_in">n</span>秒，地图上有多少个格子没有史莱姆。</span><br><span class="line"></span><br><span class="line">输入描述：</span><br><span class="line">第一行包含一个整数 <span class="built_in">n</span>(<span class="comment">1 &lt;= n &lt;= 3 * 10^3</span>)，表示地图上的格子数量。</span><br><span class="line"></span><br><span class="line">第二行包含<span class="built_in">n</span>个整数 a[i](<span class="number">0</span> &lt;= a[i] &lt;= <span class="number">1</span>)，表示每只史莱姆的跳跃方向</span><br><span class="line"></span><br><span class="line">输出描述</span><br><span class="line">输出包含一行<span class="built_in">n</span>个整数，用空格隔开，第i个数表示第i秒没有史莱姆的格子数量。</span><br><span class="line">输入：</span><br><span class="line"><span class="number">3</span></span><br><span class="line"><span class="number">1</span> <span class="number">0</span> <span class="number">1</span></span><br><span class="line"></span><br><span class="line">输出：</span><br><span class="line"><span class="number">1</span> <span class="number">2</span> <span class="number">3</span></span><br></pre></td></tr></table></figure>
</blockquote>
<p>代码实现：</p>
<figure class="highlight java"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br><span class="line">20</span><br><span class="line">21</span><br><span class="line">22</span><br><span class="line">23</span><br><span class="line">24</span><br><span class="line">25</span><br><span class="line">26</span><br><span class="line">27</span><br><span class="line">28</span><br><span class="line">29</span><br><span class="line">30</span><br></pre></td><td class="code"><pre><span class="line"><span class="keyword">public</span> <span class="keyword">static</span> <span class="keyword">void</span> <span class="title function_">main</span><span class="params">(String[] args)</span> &#123;</span><br><span class="line">    <span class="type">Scanner</span> <span class="variable">sc</span> <span class="operator">=</span> <span class="keyword">new</span> <span class="title class_">Scanner</span>(System.in);</span><br><span class="line">    <span class="comment">//包含一个整数 n(1 &lt;= n &lt;= 3 * 10^3)，表示地图上的格子数量</span></span><br><span class="line">    <span class="type">int</span> <span class="variable">n</span> <span class="operator">=</span> sc.nextInt();</span><br><span class="line">    <span class="type">int</span>[] a = <span class="keyword">new</span> <span class="title class_">int</span>[n + <span class="number">1</span>];</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">i</span> <span class="operator">=</span> <span class="number">1</span>; i &lt;= n; i++) &#123;</span><br><span class="line">        <span class="comment">//包含n个整数 a[i](0 &lt;= a[i] &lt;= 1)，表示每只史莱姆的跳跃方向</span></span><br><span class="line">        a[i] = sc.nextInt();</span><br><span class="line">    &#125;</span><br><span class="line">    <span class="type">int</span>[] res = <span class="keyword">new</span> <span class="title class_">int</span>[n + <span class="number">1</span>];</span><br><span class="line">    <span class="comment">//输出包含一行n个整数，用空格隔开，第i个数表示第i秒没有史莱姆的格子数量</span></span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">i</span> <span class="operator">=</span> <span class="number">1</span>; i &lt;= n; i++) &#123;</span><br><span class="line">        <span class="type">int</span> <span class="variable">count</span> <span class="operator">=</span> <span class="number">0</span>;</span><br><span class="line">        <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">j</span> <span class="operator">=</span> <span class="number">1</span>; j &lt;= n; j++) &#123;</span><br><span class="line">            <span class="keyword">if</span> (a[j] == <span class="number">0</span>) &#123;</span><br><span class="line">                <span class="keyword">if</span> (j - i &lt; <span class="number">0</span>) &#123;<span class="comment">//史莱姆从左边跳出地图</span></span><br><span class="line">                    count++;</span><br><span class="line">                &#125;</span><br><span class="line">            &#125; <span class="keyword">else</span> &#123;</span><br><span class="line">                <span class="keyword">if</span> (j + i &gt;= n) &#123;<span class="comment">//史莱姆从右边跳出地图</span></span><br><span class="line">                    count++;</span><br><span class="line">                &#125;</span><br><span class="line">            &#125;</span><br><span class="line">        &#125;</span><br><span class="line">        res[i] = count;</span><br><span class="line">    &#125;		</span><br><span class="line">    <span class="keyword">for</span> (<span class="type">int</span> <span class="variable">i</span> <span class="operator">=</span> <span class="number">1</span>; i &lt;= n; i++) &#123;</span><br><span class="line">        System.out.print(res[i] + <span class="string">&quot; &quot;</span>);</span><br><span class="line">    &#125;</span><br><span class="line">&#125;</span><br></pre></td></tr></table></figure>
